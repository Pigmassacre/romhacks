# ROM bank 0, which the machine starts in and takes interrupts through. What has to run
# from RAM loads from here to WRAM above the NES's 2 KB; the rest of the ROM is laid out by
# tools/build.py. ROMC, the fast code, goes at $C000 in every code bank and in this one, so
# ROM0 leaves that window free.
MEMORY {
    WVAR: start = $0800, size = $0800, type = rw, file = "";
    WRUN: start = $1000, size = $0FE0, type = rw, file = "";
    ROMC: start = $C000, size = $2000, type = ro, file = "%O.c";
    ROM0: start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM0C: start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM0E: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    WVARS:   load = WVAR, type = bss;
    WCODE:   load = ROM0, run = WRUN, type = rw, define = yes;
    ROMC:    load = ROMC, type = ro;
    BOOT:    load = ROM0, type = ro;
    TABLES:  load = ROM0, type = ro;
    HEADER:  load = ROM0E, type = ro, start = $FFC0;
    VECTORS: load = ROM0E, type = ro, start = $FFE0;
}
