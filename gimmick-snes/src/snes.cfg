# ROM bank 0, which the machine starts in and takes interrupts through. The handlers
# load from here to WRAM above the NES's 2 KB; the rest of the ROM is laid out by
# tools/build.py.
MEMORY {
    WVAR: start = $0800, size = $0800, type = rw, file = "";
    WRUN: start = $1000, size = $0FE0, type = rw, file = "";
    ROM0: start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    WVARS:   load = WVAR, type = bss;
    WCODE:   load = ROM0, run = WRUN, type = rw, define = yes;
    BOOT:    load = ROM0, type = ro;
    TABLES:  load = ROM0, type = ro;
    HEADER:  load = ROM0, type = ro, start = $FFC0;
    VECTORS: load = ROM0, type = ro, start = $FFE0;
}
